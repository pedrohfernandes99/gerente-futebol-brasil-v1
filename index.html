/* ===== CORE MEGA WORLD - FIXED ===== */
function ensurePlayerMegaFields(p){
  if(!p.stats)p.stats={goals:0,assists:0,cards:0,cleanSheets:0,apps:0};
  ['goals','assists','cards','cleanSheets','apps'].forEach(function(k){if(typeof p.stats[k]!=='number')p.stats[k]=0});
  if(typeof p.potential!=='number')p.potential=Math.min(88,(p.overall||55)+rng(1,10));
  if(typeof p.condition!=='number')p.condition=100;
  if(typeof p.morale!=='number')p.morale=70;
  if(typeof p.contractMonths!=='number')p.contractMonths=(p.contract||2)*12;
  if(!p.squadRole)p.squadRole='Rotação';
  if(typeof p.listed!=='boolean')p.listed=false;
  if(typeof p.loan!=='boolean')p.loan=false;
  if(p.loanFrom===undefined)p.loanFrom=null;
  return p;
}
function newSeedMega(){
  var base=seed();
  var players=base.players||[];
  var target=1280;
  var nextId=players.reduce(function(m,p){return Math.max(m,p.id||0)},0)+1;
  while(players.length<target){players.push(newPlayer(nextId++));}
  players.forEach(ensurePlayerMegaFields);
  base.players=players;
  base.staff=base.staff||[];
  base.staffMarket=base.staffMarket||[];
  if(base.staffMarket.length<72){
    var roles=['Treinador','Auxiliar técnico','Preparador físico','Treinador de goleiros','Analista de desempenho','Olheiro','Fisioterapeuta','Diretor de futebol'];
    for(var i=base.staffMarket.length;i<72;i++){
      base.staffMarket.push({id:10000+i,role:roles[i%roles.length],name:pick(D.firstNames)+' '+pick(D.lastNames),overall:rng(48,82),salary:rng(2500,38000),fee:rng(4000,65000),clubId:null,specialty:pick(['Tática','Base','Motivação','Preparação','Scout','Defesa','Ataque','Recuperação'])});
    }
  }
  base.financeLedger=base.financeLedger||[];
  base.seasonFinance=base.seasonFinance||{income:0,expense:0};
  base.currentDate=base.currentDate||base.season+'-02-01';
  base.inbox=base.inbox||[];
  base.fixtures=base.fixtures||[];
  base.round=base.round||0;
  return base;
}
function ensureAISquads(){
  if(!S||!Array.isArray(S.players)||!Array.isArray(S.clubs))return;
  S.players.forEach(ensurePlayerMegaFields);
  var userId=S.club&&S.club.id;
  var free=function(){return S.players.filter(function(p){return !p.clubId&&!p.loan})};
  S.clubs.forEach(function(c){
    if(c.id===userId)return;
    if(c.noDivision&&!c.playoffActive){S.players.forEach(function(p){if(p.clubId===c.id)p.clubId=null});return}
    var roster=S.players.filter(function(p){return p.clubId===c.id});
    var target=Math.max(18,Math.min(21,18+(c.tier===1?3:c.tier===2?2:1)));
    if(roster.length<target){
      var pool=free().sort(function(a,b){var ca=Math.abs((a.overall||55)-(c.tier===1?72:c.tier===2?63:57));var cb=Math.abs((b.overall||55)-(c.tier===1?72:c.tier===2?63:57));return ca-cb});
      for(var i=0;i<pool.length&&roster.length<target;i++){pool[i].clubId=c.id;roster.push(pool[i]);}
    }
    if(roster.length>22){
      roster.sort(function(a,b){return (a.overall||0)-(b.overall||0)});
      while(roster.length>22){var out=roster.shift();out.clubId=null;out.listed=false;}
    }
  });
}
function normalizeGameData(){
  if(!S||typeof S!=='object')return;
  if(!Array.isArray(S.players))S.players=[];
  S.players.forEach(function(p){
    p.age=Number.isFinite(Number(p.age))?Number(p.age):24;
    p.overall=Number.isFinite(Number(p.overall))?Number(p.overall):55;
    p.potential=Number.isFinite(Number(p.potential))?Number(p.potential):Math.max(p.overall,60);
    p.value=Number.isFinite(Number(p.value))?Number(p.value):Math.max(50000,Math.round((p.overall*p.overall*180)/1000)*1000);
    p.wage=Number.isFinite(Number(p.wage))?Number(p.wage):Math.max(1200,Math.round(p.value/85/100)*100);
    p.contractMonths=Number.isFinite(Number(p.contractMonths))?Number(p.contractMonths):Math.max(12,(Number(p.contract)||2)*12);
    p.form=Number.isFinite(Number(p.form))?Number(p.form):60;
    p.fitness=Number.isFinite(Number(p.fitness))?Number(p.fitness):95;
    p.morale=Number.isFinite(Number(p.morale))?Number(p.morale):70;
    p.stats=p.stats||{};
  });
  if(!Array.isArray(S.staff))S.staff=[];
  S.staff.forEach(function(x){
    x.overall=Number.isFinite(Number(x.overall))?Number(x.overall):55;
    x.salary=Number.isFinite(Number(x.salary))?Number(x.salary):6000;
    x.fee=Number.isFinite(Number(x.fee))?Number(x.fee):Math.max(3000,Math.round(x.salary*1.5/1000)*1000);
    x.specialty=x.specialty||'Geral';
  });
  if(!Array.isArray(S.staffMarket))S.staffMarket=[];
  S.staffMarket.forEach(function(x){
    x.overall=Number.isFinite(Number(x.overall))?Number(x.overall):55;
    x.salary=Number.isFinite(Number(x.salary))?Number(x.salary):6000;
    x.fee=Number.isFinite(Number(x.fee))?Number(x.fee):Math.max(3000,Math.round(x.salary*(1.2+x.overall/100)/1000)*1000);
    x.specialty=x.specialty||'Geral';
  });
  S.cash=Number.isFinite(Number(S.cash))?Number(S.cash):0;
}
function migrateMega(){
  if(!S||typeof S!=='object')S=newSeedMega();
  if(!Array.isArray(S.players))S.players=[];
  if(!Array.isArray(S.clubs))S.clubs=[];
  if(S.players.length<1000){
    var id=S.players.reduce(function(m,p){return Math.max(m,p.id||0)},0)+1;
    while(S.players.length<1280)S.players.push(newPlayer(id++));
  }
  S.players.forEach(ensurePlayerMegaFields);
  if(!Array.isArray(S.staff))S.staff=[];
  if(!Array.isArray(S.staffMarket))S.staffMarket=[];
  if(S.staffMarket.length<72){
    var roles=['Treinador','Auxiliar técnico','Preparador físico','Treinador de goleiros','Analista de desempenho','Olheiro','Fisioterapeuta','Diretor de futebol'];
    for(var i=S.staffMarket.length;i<72;i++)S.staffMarket.push({id:10000+i,role:roles[i%roles.length],name:pick(D.firstNames)+' '+pick(D.lastNames),overall:rng(48,82),salary:rng(2500,38000),clubId:null,specialty:pick(['Tática','Base','Motivação','Preparação','Scout','Defesa','Ataque','Recuperação'])});
  }
  normalizeGameData();
  if(!Array.isArray(S.financeLedger))S.financeLedger=[];
  if(!S.seasonFinance)S.seasonFinance={income:0,expense:0};
  if(!S.currentDate)S.currentDate=(S.season||2026)+'-02-01';
  if(!Array.isArray(S.inbox))S.inbox=[];
  if(!Array.isArray(S.fixtures))S.fixtures=[];
  if(!S.competitionPhase)S.competitionPhase='league';
  S.clubs.forEach(function(c){if(typeof c.noDivision!=='boolean')c.noDivision=(c.tier===0);if(c.noDivision&&!c.status)c.status='Sem divisão'});
  ensureAISquads();
  /* Corrige saves de versões anteriores que carregaram jogos de outro ano para a temporada atual. */
  if(S.created&&S.club&&S.competitionPhase==='league'&&S.club.tier>0&&S.fixtures.length){
    var wrongYear=S.fixtures.some(function(f){return !f.isPlayoff&&String(f.date||'').slice(0,4)!==String(S.season)});
    if(wrongYear){resetSeasonData();generateLeague();return}
    var currentPlayed=S.fixtures.some(function(f){return !f.isPlayoff&&f.played});
    if(!currentPlayed){
      S.clubs.forEach(function(c){c.pts=0;c.p=0;c.w=0;c.d=0;c.l=0;c.gf=0;c.ga=0;c.form=[]});
      S.players.forEach(function(p){p.stats={goals:0,assists:0,cards:0,cleanSheets:0,apps:0}});
    }
  }
  save();
}

<script>
(function(){
 function enableTouchPitch(){
   var pitch=document.getElementById('tacticalPitch');
   if(!pitch||pitch.dataset.touchReady==='1')return;
   pitch.dataset.touchReady='1';
   var active=null,pid=null;
   function moveTo(ev){
     if(!active||pid==null)return;
     var r=pitch.getBoundingClientRect(),cx=ev.clientX,cy=ev.clientY;
     var x=Math.max(5,Math.min(95,(cx-r.left)/r.width*100));
     var y=Math.max(5,Math.min(95,(cy-r.top)/r.height*100));
     active.style.left=x+'%';active.style.top=y+'%';
     if(window.S&&S.tactics){S.tactics.positions[pid]={x:x,y:y}}
   }
   pitch.addEventListener('pointerdown',function(e){
     var el=e.target.closest('.pitch-player');if(!el)return;
     active=el;pid=+el.dataset.pid;try{el.setPointerCapture(e.pointerId)}catch(_e){}
     e.preventDefault();
   });
   pitch.addEventListener('pointermove',function(e){if(active){moveTo(e);e.preventDefault()}});
   function end(e){if(!active)return;moveTo(e);if(typeof save==='function')save();active=null;pid=null;e.preventDefault()}
   pitch.addEventListener('pointerup',end);pitch.addEventListener('pointercancel',function(){active=null;pid=null});
 }
 var oldRender=window.renderPitch;
 if(typeof oldRender==='function'){
   window.renderPitch=function(){oldRender.apply(this,arguments);enableTouchPitch()};
 }
 document.addEventListener('pointerdown',function(){setTimeout(enableTouchPitch,0)},{passive:true});
 setTimeout(enableTouchPitch,300);
})();
</script>
